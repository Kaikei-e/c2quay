compose:
  files:
    - compose.yaml
  project_name: myapp

broker:
  base_url: https://pact-broker.example.com

versioning:
  strategy: manifest_file
  options:
    path: .c2quay/versions.json

deploy:
  wait: true
  wait_timeout: 180s
  smoke:
    command: ./scripts/smoke.sh
    timeout: 30s
    env:
      TARGET_ENV: production

environments:
  production:
    all_or_nothing: true
    services:
      api:
        pacticipant: api
      web:
        pacticipant: web
