compose:
  files:
    - compose.yaml
  project_name: myapp

broker:
  base_url: https://pact-broker.example.com
  # Authentication MUST NOT be written here.
  # Use environment variables instead:
  #   PACT_BROKER_USERNAME / PACT_BROKER_PASSWORD  (Basic auth)
  #   PACT_BROKER_TOKEN                            (Bearer token)

versioning:
  strategy: manifest_file          # or: resolved_image_digest | git_sha
  options:
    path: .c2quay/versions.json

deploy:
  wait: true
  wait_timeout: 180s
  # pull controls whether c2quay runs `docker compose pull <services>`
  # between the gate and `compose up`. See ADR 0010.
  #   never   (default) — do nothing; images must already be fresh
  #   always  — fetch the services in the plan before `up`
  #   missing — no-op in c2quay; Compose's own default already handles it
  pull: never
  smoke:
    command: ./scripts/smoke.sh
    timeout: 30s
    env:
      TARGET_ENV: production

environments:
  production:
    # all_or_nothing: true sends every (pacticipant, version) in the plan
    # to the broker's matrix endpoint as a single aggregate query, so the
    # broker evaluates the candidate set as a monolithic rollout. Use this
    # when you ship all services together at the same version. Requires
    # the broker to expose the generic pb:can-i-deploy relation.
    # all_or_nothing: false (default) fans out per-service can-i-deploy
    # calls instead — correct for truly-independent deploys.
    all_or_nothing: true
    services:
      api:
        pacticipant: api
      web:
        pacticipant: web
