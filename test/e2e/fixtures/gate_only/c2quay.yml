compose:
  files:
    - compose.yaml
  project_name: c2quay-gate-only

broker:
  base_url: http://127.0.0.1:1

versioning:
  strategy: manifest_file
  options:
    path: versions.json

environments:
  production:
    all_or_nothing: true
    services:
      api:
        pacticipant: api
      tts-speaker:
        pacticipant: tts-speaker
        gate_only: true
